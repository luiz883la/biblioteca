<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../login/style.css">
    <title>cadastrar</title>
</head>
<body>
    <div class="login">
        <h1>Cadastrar</h1>
        <form autocomplete="on">
            <p>
                <label for="nome"><span style="color: red;">*</span> Primeiro Nome:</label>
                <input type="text" placeholder="Digite seu nome" id="nome" class="nome" onkeypress="letraMaiuscula()" autofocus required autocomplete="username">
            </p>
            <p class="alerta_nome"></p>
            <p><label for="senha"><span style="color: red;">*</span> Senha:</label>
                <input type="text" placeholder="Crie uma senha" id="senha" class="senha" required autocomplete="new-password">
            </p>
            <input type="button" value="Cadastrar" class="button">
            <p class="alerta_senha"></p>
            
        </form>
        <p>Voce ja tem conta? <a href="../login/logar.html">Fazer login</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
