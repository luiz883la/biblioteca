<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../../midia/favicon.ico" type="image/x-icon">
    <title>login</title>
</head>
<body>
    <div class="login">
        <h1><u>Login</u></h1>
        <form autocomplete="on" action="script.js">
            <p>
                <label for="nome"><span style="color: red;">*</span> Nome:</label>
                <input type="text" placeholder="Digite seu nome" id="nome" class="nome" onkeydown="letraMaiuscula()" autofocus required autocomplete="username">
            </p>
            <p class="alerta_nome"></p>
            <p>
                <label for="senha"><span style="color: red;">*</span> Senha:</label>
                <input type="password" placeholder="Digite sua senha" id="senha" class="senha" required autocomplete="current-password">
            </p>
            <input type="button" class="button" value="Conectar">
        </form>

        <p>
            Nao tem conta? <a href="../cadastrar/cadastrar.html">Cadastre-se</a>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
